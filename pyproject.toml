[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pgw-api"
version = "1.3.1"
description = "Python API client for Philadelphia Gas Works (PGW)"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12"
authors = [
    {name = "zackwag"},
]
dependencies = [
    "aiohttp>=3.9.0",
]

[project.urls]
Homepage = "https://github.com/zackwag/pgw-api"
Issues = "https://github.com/zackwag/pgw-api/issues"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.setuptools.packages.find]
include = ["pgw_api*"]

[tool.ruff]
line-length = 100

[tool.ruff.lint.per-file-ignores]
# These construct naive datetimes to match _parse_datetime's deliberately
# naive output (the portal's timestamps carry no timezone offset) -- see
# the docstring on _parse_datetime in pgw_api/client.py.
"tests/test_client.py" = ["DTZ001"]
"tests/test_models.py" = ["DTZ001"]
"tests/test_parsing.py" = ["DTZ001"]
